name: CI-CD Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests automatisés
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
      - name: Lancer les tests
        run: python -m unittest discover -s tests -v

  build:
    name: Construction de l'image Docker
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t portfolio:${{ github.sha }} .
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name essai -p 8080:80 portfolio:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080
          docker rm -f essai